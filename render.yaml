# ==========================================================
# CinemaFlow (WebXemPhim) - Render Blueprint
# Docs: https://render.com/docs/blueprint-spec
# ==========================================================

services:
  # --------------------------------------------------------
  # Web Service 1: CinemaFlow REST API Server
  # --------------------------------------------------------
  - type: web
    name: w-phim-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: Dockerfile.server
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Database__Provider
        value: PostgreSql
      - key: DATABASE_URL
        sync: false
      - key: Security__StreamSigningKey
        generateValue: true
      - key: Payment__WebhookSecret
        generateValue: true
      - key: Security__BehindReverseProxy
        value: "true"
      - key: AllowedHosts
        value: "*"

  # --------------------------------------------------------
  # Web Service 2: CinemaFlow Blazor Web Client
  # --------------------------------------------------------
  - type: web
    name: w-phim-client
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: Dockerfile.client
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Security__BehindReverseProxy
        value: "true"
      - key: AllowedHosts
        value: "*"
      - key: ApiBaseUrl
        fromService:
          type: web
          name: w-phim-api
          property: host
