# ==========================================================
# CinemaFlow (WebXemPhim) - Render Blueprint
# Docs: https://render.com/docs/blueprint-spec
# ==========================================================

services:
  # --------------------------------------------------------
  # Web Service 1: CinemaFlow REST API Server
  # --------------------------------------------------------
  - type: web
    name: w-phim-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: Dockerfile.server
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Database__Provider
        value: PostgreSql
      # Supabase PostgreSQL Database URL (Pooler aws-0-ap-south-1.pooler.supabase.com:5432)
      - key: DATABASE_URL
        sync: false
      - key: Supabase__Url
        sync: false
      - key: Supabase__PublishableKey
        sync: false
      - key: Supabase__SecretKey
        sync: false
      - key: Security__StreamSigningKey
        generateValue: true
      - key: Payment__WebhookSecret
        generateValue: true
      - key: Security__BehindReverseProxy
        value: "true"
      - key: Security__KnownProxyNetworks__0
        value: "10.0.0.0/8"
      - key: Security__KnownProxyNetworks__1
        value: "172.16.0.0/12"
      - key: Security__KnownProxyNetworks__2
        value: "192.168.0.0/16"
      - key: Security__AllowedOrigins__0
        value: "https://w-phim-client.onrender.com"
      - key: Security__PublicApiBaseUrl
        value: "https://w-phim-api.onrender.com"
      - key: AllowedHosts
        value: "w-phim-api.onrender.com;localhost;127.0.0.1;[::1]"
      # Optional one-time bootstrap administrator for a fresh database.
      # Remove these variables after the first successful deployment.
      - key: Database__BootstrapAdminEmail
        sync: false
      - key: Database__BootstrapAdminPassword
        sync: false
      # Cloudflare R2 / S3 Cloud Storage (Gốc lưu phim riêng tốc độ cao 0đ băng thông)
      - key: CloudStorage__Provider
        value: "CloudflareR2"
      - key: CloudStorage__AccountId
        sync: false
      - key: CloudStorage__AccessKeyId
        sync: false
      - key: CloudStorage__SecretAccessKey
        sync: false
      - key: CloudStorage__BucketName
        value: "webxemphim-movies"

  # --------------------------------------------------------
  # Web Service 2: CinemaFlow Blazor Web Client
  # --------------------------------------------------------
  - type: web
    name: w-phim-client
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: Dockerfile.client
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Security__BehindReverseProxy
        value: "true"
      - key: Security__KnownProxyNetworks__0
        value: "10.0.0.0/8"
      - key: Security__KnownProxyNetworks__1
        value: "172.16.0.0/12"
      - key: Security__KnownProxyNetworks__2
        value: "192.168.0.0/16"
      - key: Security__AllowedOrigins__0
        value: "https://w-phim-client.onrender.com"
      - key: Security__PublicApiBaseUrl
        value: "https://w-phim-api.onrender.com"
      - key: AllowedHosts
        value: "w-phim-client.onrender.com;localhost;127.0.0.1;[::1]"
      - key: ApiBaseUrl
        value: "https://w-phim-api.onrender.com"
