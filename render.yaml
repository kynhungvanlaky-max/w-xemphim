# ==========================================================
# CinemaFlow (WebXemPhim) - Render Blueprint
# Docs: https://render.com/docs/blueprint-spec
# ==========================================================

services:
  # --------------------------------------------------------
  # Web Service 1: CinemaFlow REST API Server
  # --------------------------------------------------------
  - type: web
    name: w-phim-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: Dockerfile.server
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Database__Provider
        value: PostgreSql
      - key: DATABASE_URL
        value: postgresql://gamestore_user:***REMOVED***@dpg-dbji4967bikc73fhaao0-a.singapore-postgres.render.com/gamestore_3t6q
      - key: Security__StreamSigningKey
        generateValue: true
      - key: Payment__WebhookSecret
        generateValue: true
      - key: Security__BehindReverseProxy
        value: "true"
      - key: Security__AllowedOrigins__0
        value: "https://w-phim-client.onrender.com"
      - key: Security__AllowedOrigins__1
        value: "http://localhost:5229"
      - key: Security__PublicApiBaseUrl
        value: "https://w-phim-api.onrender.com"
      - key: AllowedHosts
        value: "*"
      # Cloudflare R2 / S3 Cloud Storage (Gốc lưu phim riêng tốc độ cao 0đ băng thông)
      - key: CloudStorage__Provider
        value: "CloudflareR2"
      - key: CloudStorage__AccountId
        value: "***REMOVED***"
      - key: CloudStorage__AccessKeyId
        value: "***REMOVED***"
      - key: CloudStorage__SecretAccessKey
        value: "***REMOVED***"
      - key: CloudStorage__BucketName
        value: "webxemphim-movies"
      - key: CloudStorage__ServiceUrl
        value: "https://***REMOVED***.r2.cloudflarestorage.com"

  # --------------------------------------------------------
  # Web Service 2: CinemaFlow Blazor Web Client
  # --------------------------------------------------------
  - type: web
    name: w-phim-client
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: Dockerfile.client
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Security__BehindReverseProxy
        value: "true"
      - key: Security__AllowedOrigins__0
        value: "https://w-phim-client.onrender.com"
      - key: Security__AllowedOrigins__1
        value: "http://localhost:5229"
      - key: Security__PublicApiBaseUrl
        value: "https://w-phim-api.onrender.com"
      - key: AllowedHosts
        value: "*"
      - key: ApiBaseUrl
        fromService:
          type: web
          name: w-phim-api
          property: host
