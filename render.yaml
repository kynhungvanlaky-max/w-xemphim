# ==========================================================
# CinemaFlow (WebXemPhim) - Render Blueprint
# Docs: https://render.com/docs/blueprint-spec
# ==========================================================

services:
  # --------------------------------------------------------
  # Web Service: CinemaFlow All-in-One (.NET 10 Blazor + REST API)
  # --------------------------------------------------------
  - type: web
    name: w-phim
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Database__Provider
        value: PostgreSql
      - key: DATABASE_URL
        sync: false
      - key: Security__StreamSigningKey
        generateValue: true
      - key: Payment__WebhookSecret
        generateValue: true
      - key: Security__BehindReverseProxy
        value: "true"
      - key: AllowedHosts
        value: "*"
