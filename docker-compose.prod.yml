services:
  # ==========================================
  # Caddy Reverse Proxy & Automatic SSL/TLS
  # ==========================================
  caddy:
    container_name: webxemphim-caddy
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:?DOMAIN_REQUIRED}
      - ACME_EMAIL=${ACME_EMAIL:-admin@cinemaflow.vn}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server
      - client
    networks:
      - cinemaflow-net

  # ==========================================
  # CinemaFlow REST API Server (.NET 10)
  # ==========================================
  server:
    container_name: webxemphim-server
    image: ghcr.io/${IMAGE_REPO:-kynhungvanlaky-max/w-xemphim}/webxemphim-server:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: src/Server/WebXemPhim.Server/Dockerfile
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - DOTNET_RUNNING_IN_CONTAINER=true
      - Database__Provider=PostgreSql
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=${POSTGRES_DB:-webxemphim};Username=${POSTGRES_USER:-webxemphim};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_REQUIRED}
      - Database__SeedDemoData=false
      # Optional one-time administrator bootstrap. Remove both variables after first deploy.
      - Database__BootstrapAdminEmail=${BOOTSTRAP_ADMIN_EMAIL:-}
      - Database__BootstrapAdminPassword=${BOOTSTRAP_ADMIN_PASSWORD:-}
      - Security__DataProtectionKeyPath=/app/keys
      # Required: there is deliberately no public fallback key in this file.
      - Security__StreamSigningKey=${STREAM_SIGNING_KEY:?STREAM_SIGNING_KEY_REQUIRED}
      - Security__StreamTtlMinutes=${STREAM_TTL_MINUTES:-10}
      - Security__PublicApiBaseUrl=${PUBLIC_API_BASE_URL:?PUBLIC_API_BASE_URL_REQUIRED}
      - Payment__WebhookSecret=${PAYMENT_WEBHOOK_SECRET:?PAYMENT_WEBHOOK_SECRET_REQUIRED}
      - Payment__Gateways__PayOS__WebhookSecret=${PAYOS_WEBHOOK_SECRET:-}
      - Payment__Gateways__VNPay__HashSecret=${VNPAY_HASH_SECRET:-}
      - Security__AllowedOrigins__0=https://${DOMAIN:?DOMAIN_REQUIRED}
      - Security__BehindReverseProxy=true
      - Security__KnownProxyNetworks__0=172.16.0.0/12
      - Security__KnownProxyNetworks__1=10.0.0.0/8
      - Security__KnownProxyNetworks__2=192.168.0.0/16
      - Security__KnownProxyNetworks__3=127.0.0.1/8
      - AllowedHosts=${ALLOWED_HOSTS:?ALLOWED_HOSTS_REQUIRED}
      # Optional Cloudflare R2 / S3 configuration (local fallback is used when empty).
      - CloudStorage__Provider=${CLOUD_STORAGE_PROVIDER:-CloudflareR2}
      - CloudStorage__AccountId=${CLOUD_STORAGE_ACCOUNT_ID:-}
      - CloudStorage__AccessKeyId=${CLOUD_STORAGE_ACCESS_KEY_ID:-}
      - CloudStorage__SecretAccessKey=${CLOUD_STORAGE_SECRET_ACCESS_KEY:-}
      - CloudStorage__BucketName=${CLOUD_STORAGE_BUCKET_NAME:-webxemphim-movies}
      - CloudStorage__ServiceUrl=${CLOUD_STORAGE_SERVICE_URL:-}
      - CloudStorage__PublicBaseUrl=${CLOUD_STORAGE_PUBLIC_BASE_URL:-}
    volumes:
      - server_data:/app/data
      - server_keys:/app/keys
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cinemaflow-net

  # ==========================================
  # CinemaFlow Blazor Web Client (.NET 10)
  # ==========================================
  client:
    container_name: webxemphim-client
    image: ghcr.io/${IMAGE_REPO:-kynhungvanlaky-max/w-xemphim}/webxemphim-client:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: src/Client/WebXemPhim.Client/Dockerfile
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - DOTNET_RUNNING_IN_CONTAINER=true
      - ApiBaseUrl=http://server:8080
      - Security__BehindReverseProxy=true
      - Security__DataProtectionKeyPath=/app/keys
      - Security__KnownProxyNetworks__0=172.16.0.0/12
      - Security__KnownProxyNetworks__1=10.0.0.0/8
      - Security__KnownProxyNetworks__2=192.168.0.0/16
      - Security__KnownProxyNetworks__3=127.0.0.1/8
      - AllowedHosts=${ALLOWED_HOSTS:?ALLOWED_HOSTS_REQUIRED}
    volumes:
      - client_keys:/app/keys
    depends_on:
      - server
    networks:
      - cinemaflow-net

  # ==========================================
  # PostgreSQL 17 Database Engine
  # ==========================================
  postgres:
    container_name: webxemphim-postgres
    image: postgres:17-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-webxemphim}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_REQUIRED}
      - POSTGRES_DB=${POSTGRES_DB:-webxemphim}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgresql/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-webxemphim} -d ${POSTGRES_DB:-webxemphim}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - cinemaflow-net

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  server_data:
  server_keys:
  client_keys:

networks:
  cinemaflow-net:
    driver: bridge
