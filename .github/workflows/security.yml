name: Security - Secret & Dependency Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore WebXemPhim.slnx

      - name: Scan NuGet packages for known vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          output="$(dotnet list WebXemPhim.slnx package --vulnerable --include-transitive)"
          echo "$output"
          if grep -qi "has the following vulnerable packages" <<< "$output"; then
            echo "::error::Vulnerable NuGet packages detected. Update the affected dependencies."
            exit 1
          fi
